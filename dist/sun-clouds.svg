<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Static low-frequency density; CSS moves this surface without recomputing
       turbulence parameters. The outer fade protects every overscanned edge. -->
  <defs>
    <filter id="density" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".0034 .0052" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .07  0 0 0 0 .105  0 0 0 0 .135  2.8 0 0 0 -.88"/>
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="edge" r=".7">
      <stop offset=".38" stop-color="white"/>
      <stop offset=".72" stop-color="white" stop-opacity=".85"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="feather"><rect width="1200" height="800" fill="url(#edge)"/></mask>
  </defs>
  <rect width="1200" height="800" filter="url(#density)" mask="url(#feather)"/>
</svg>
